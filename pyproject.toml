[project]
name = "openjev"
version = "0.5.0"
description = "Open, Jev-compatible System One decision server on DiffusionGemma"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "transformers>=4.56", "tokenizers", "jinja2"]

[project.optional-dependencies]
test = ["pytest", "typesafe-sdk>=0.7"]
# Apple silicon: the in-process MLX backend (OPENJEV_BACKEND=mlx)
mlx = ["mlx-vlm==0.6.15; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# The small encoder models (OPENJEV_BACKEND=laya or verdict); both need PyTorch
laya = ["laya==0.3.6"]
verdict = ["gliclass==0.1.20"]
# Liquid AI's d1-2B (OPENJEV_BACKEND=d1), at the versions it was evaluated with
d1 = ["transformers==5.22.2", "torch==2.15.0", "torchvision==0.29.2", "pillow==13.0.0"]

[project.urls]
Homepage = "https://codiv.ai"
Source = "https://github.com/razorback16/openjev"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openjev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
